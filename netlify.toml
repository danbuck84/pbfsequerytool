[build]
  publish = "public"
  functions = "netlify/functions"

# Redirect /api/* calls to Netlify Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/queries"
  to = "/.netlify/functions/queries"
  status = 200

[[redirects]]
  from = "/api/query"
  to = "/.netlify/functions/query"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/api/matcher"
  to = "/.netlify/functions/matcher"
  status = 200
